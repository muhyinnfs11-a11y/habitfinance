<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HabitFinance</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b2a5b"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0b2a5b;--a:#3a9d3a;--bg:#f2f6f4;--card:#fff;--tx:#14213d;--mu:#6b7a8c;--bd:#e3ebe7;--rd:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-dark="1"]{--bg:#0f1720;--card:#18232f;--tx:#eaf1f5;--mu:#93a4b5;--bd:#26343f}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header img{width:46px;height:46px;border-radius:12px;background:#fff;padding:2px}
header b{font-size:20px;font-weight:800}header b span{color:var(--a)}
header small{display:block;color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;border:0}
h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mu{color:var(--mu);font-size:12px}.big{font-size:24px;font-weight:800}
.btn{background:var(--a);color:#fff;border:0;border-radius:12px;padding:8px 14px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.btn.s{background:var(--bd);color:var(--tx)}.btn.p{background:var(--p)}
.ico{font-size:22px;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--a) 15%,transparent);display:grid;place-items:center}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--a);background:none;color:#fff;font-size:15px;cursor:pointer;flex:none}
.chk.on{background:var(--a)}
.item{padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.grow{flex:1;min-width:0}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--a);border-radius:8px}
.bar.o i{background:var(--rd)}
.in{color:var(--a);font-weight:800}.out{color:var(--rd);font-weight:800}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:120px;background:none;border:0;color:var(--mu);font:700 11px inherit;font-family:inherit;padding:6px;border-radius:12px;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent)}
.dots{display:flex;gap:4px}.dots i{width:16px;height:16px;border-radius:5px;background:var(--bd)}.dots i.on{background:var(--a)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.on{border-color:var(--tx)}
#md{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}
#md.show{display:flex}
#md form,#md .box{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px;display:grid;gap:10px}
label{font-size:12px;color:var(--mu);font-weight:700;display:grid;gap:4px}
input,select{font:600 15px inherit;font-family:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
input[type=color]{height:44px;padding:3px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 16px;border-radius:14px;display:none;z-index:20;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs .btn{flex:1}
.paper{background:#fff;color:#111;border-radius:14px;padding:16px;font-size:12px;overflow-x:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}.paper h2{font-size:16px}.paper table{width:100%;border-collapse:collapse;margin:6px 0 12px}.paper th,.paper td{border:1px solid #cfd8d3;padding:3px 5px;text-align:left}.paper th{background:#eef4f0}.paper .c{text-align:center;padding:2px;font-size:10px}.paper .r{text-align:right}
@media print{body{background:#fff;padding:0}header,nav,.noprint,#toast,#md{display:none!important}.wrap{max-width:none;padding:0}.paper{padding:0;overflow:visible;border-radius:0}@page{margin:10mm}}
#md .box,#md form{max-height:92vh;overflow:auto}
</style></head><body>

<div id="md" onclick="if(event.target==this)closeM()"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date()),fmt=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const OUT=['Makanan','Transportasi','Hiburan','Kebutuhan Bulanan','Kesehatan','Pendidikan','Lainnya'],INC=['Gaji','Bonus','Tabungan','Lainnya'];
const COL=['#3a9d3a','#0b5fbf','#f2a900','#e0567a','#8a5cf5','#17a2b8','#ff7a45'];
const PRE={Hijau:['#0b2a5b','#3a9d3a'],Samudra:['#0a3d62','#1e90ff'],Ungu:['#4b2a8a','#b25cf0'],Oranye:['#7a2e0e','#f28c28'],Mawar:['#7a1f45','#e8587f'],Zaitun:['#2f3e1f','#8aa62b']};
let S=null;try{S=JSON.parse(localStorage.getItem('hf'))}catch(e){}
if(!S)S={tab:'home',pre:'Hijau',p:PRE.Hijau[0],a:PRE.Hijau[1],dk:0,
habits:[['Bangun pagi','🌅','04:30'],['Olahraga','🏃','05:00'],['Membaca','📖','20:00'],['Belajar','🎓','19:00'],['Tidur tepat waktu','😴','21:30']].map(h=>({id:uid(),name:h[0],icon:h[1],time:h[2],done:{}})),
accounts:[{id:'a1',name:'Tunai',type:'Tunai'},{id:'a2',name:'Rekening Bank',type:'Bank'},{id:'a3',name:'Tabungan',type:'Tabungan'}],tx:[],budgets:{}};
const save=()=>{try{localStorage.setItem('hf',JSON.stringify(S))}catch(e){}};
function theme(){const r=document.documentElement.style;r.setProperty('--p',S.p);r.setProperty('--a',S.a);document.documentElement.dataset.dark=S.dk;$('#dk').textContent=S.dk?'☀️':'🌙'}
function dark(){S.dk=S.dk?0:1;save();render()}
function go(t){S.tab=t;if(t!='fin')S.fv=null;save();render();scrollTo(0,0)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',4000)}
/* habits */
const isDone=(h,d)=>!!h.done[d];
function streak(h){let d=new Date(),n=0;if(!isDone(h,ymd(d)))d.setDate(d.getDate()-1);while(isDone(h,ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function last7(h){let o='';for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o+=`<i class="${isDone(h,ymd(d))?'on':''}"></i>`}return o}
function tog(id){const h=S.habits.find(x=>x.id==id),t=today();h.done[t]?delete h.done[t]:h.done[t]=1;save();render()}
function delH(id){const h=S.habits.find(x=>x.id==id);ask('Hapus kebiasaan "'+h.name+'" beserta riwayatnya?',()=>{S.habits=S.habits.filter(x=>x.id!=id);save();render();toast('Kebiasaan dihapus')})}
function editH(id){const h=S.habits.find(x=>x.id==id);form('Ubah Kebiasaan',[{k:'name',l:'Nama',v:h.name},{k:'icon',l:'Ikon (emoji)',v:h.icon},{k:'time',l:'Pengingat',t:'time',v:h.time}],v=>{Object.assign(h,{name:v.name||h.name,icon:v.icon||h.icon,time:v.time});save();render()})}
function clearHist(){ask('Hapus seluruh riwayat centang semua kebiasaan?',()=>{S.habits.forEach(h=>h.done={});save();render()})}
function delA(id){if(S.accounts.length<2)return toast('Minimal harus ada 1 akun');ask('Hapus akun ini beserta semua transaksinya?',()=>{S.accounts=S.accounts.filter(a=>a.id!=id);S.tx=S.tx.filter(t=>t.acc!=id);save();render()})}
function delB(c){delete S.budgets[c];save();render()}
function addH(){form('Kebiasaan Baru',[{k:'name',l:'Nama kebiasaan'},{k:'icon',l:'Ikon (emoji)',v:'⭐'},{k:'time',l:'Pengingat',t:'time',v:'06:00'}],v=>{S.habits.push({id:uid(),name:v.name||'Kebiasaan',icon:v.icon||'⭐',time:v.time,done:{}});save();render()})}
function pct(){const n=S.habits.length;return n?Math.round(S.habits.filter(h=>isDone(h,today())).length/n*100):0}
function ring(p){const c=2*Math.PI*40;return `<svg width="96" height="96" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#fff4" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">${p}%</text></svg>`}
function habitRow(h){return `<div class="item row"><button class="chk ${isDone(h,today())?'on':''}" onclick="tog('${h.id}')">${isDone(h,today())?'✓':''}</button><div class="ico">${h.icon}</div><div class="grow"><b>${h.name}</b><div class="mu">⏰ ${h.time} · 🔥 ${streak(h)} hari</div></div><div class="dots">${last7(h)}</div></div>`}
/* finance */
const mon=()=>S.fv||today().slice(0,7);
const bal=id=>S.tx.filter(t=>t.acc==id).reduce((s,t)=>s+(t.type=='in'?t.amt:-t.amt),0);
const sum=(ty,m)=>S.tx.filter(t=>t.type==ty&&(!m||t.date.startsWith(m))).reduce((s,t)=>s+t.amt,0);
function addT(ty){form(ty=='in'?'Pemasukan Baru':'Pengeluaran Baru',[{k:'amt',l:'Jumlah (Rp)',t:'number'},{k:'cat',l:'Kategori',t:'select',o:ty=='in'?INC:OUT},{k:'acc',l:'Akun',t:'select',o:S.accounts.map(a=>[a.id,a.name])},{k:'note',l:'Catatan'},{k:'date',l:'Tanggal',t:'date',v:today()}],v=>{if(+v.amt>0){S.tx.push({id:uid(),type:ty,amt:+v.amt,cat:v.cat,acc:v.acc,note:v.note,date:v.date||today()});save();render()}})}
function delT(id){ask('Hapus transaksi ini?',()=>{S.tx=S.tx.filter(t=>t.id!=id);save();render()})}
function addA(){form('Akun Baru',[{k:'name',l:'Nama akun'},{k:'type',l:'Jenis',t:'select',o:['Tunai','Bank','E-Wallet','Tabungan']}],v=>{S.accounts.push({id:uid(),name:v.name||v.type,type:v.type});save();render()})}
function addB(){form('Atur Anggaran Bulanan',[{k:'cat',l:'Kategori',t:'select',o:OUT},{k:'amt',l:'Batas (Rp)',t:'number',v:S.budgets[OUT[0]]||''}],v=>{S.budgets[v.cat]=+v.amt;save();render()})}
function catData(){const m={};S.tx.filter(t=>t.type=='out'&&t.date.startsWith(mon())).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function donut(){const d=catData(),tot=d.reduce((s,x)=>s+x[1],0);if(!tot)return '<p class="mu">Belum ada pengeluaran bulan ini.</p>';let off=0;const c=2*Math.PI*35;
const arcs=d.map((x,i)=>{const l=x[1]/tot*c,s=`<circle cx="50" cy="50" r="35" fill="none" stroke="${COL[i%7]}" stroke-width="16" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l;return s}).join('');
return `<div class="row"><svg width="130" height="130" viewBox="0 0 100 100">${arcs}</svg><div class="grow">${d.map((x,i)=>`<div class="row sp mu" style="margin:3px 0"><span><b style="color:${COL[i%7]}">●</b> ${x[0]}</span><span>${Math.round(x[1]/tot*100)}%</span></div>`).join('')}</div></div>`}
function bars(){const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
const data=ms.map(m=>[sum('in',m),sum('out',m)]),mx=Math.max(1,...data.flat());
return `<svg viewBox="0 0 300 120" width="100%">${data.map((d,i)=>{const x=i*50+8,h1=d[0]/mx*90,h2=d[1]/mx*90;return `<rect x="${x}" y="${100-h1}" width="16" height="${h1}" rx="3" fill="var(--a)"/><rect x="${x+18}" y="${100-h2}" width="16" height="${h2}" rx="3" fill="var(--rd)"/><text x="${x+17}" y="114" text-anchor="middle" font-size="9" fill="var(--mu)">${ms[i].slice(5)}</text>`}).join('')}</svg><div class="mu">🟩 Pemasukan &nbsp; 🟥 Pengeluaran (6 bulan terakhir)</div>`}
/* views */
const V={
home(){const tot=S.accounts.reduce((s,a)=>s+bal(a.id),0),sv=S.accounts.filter(a=>a.type=='Tabungan').reduce((s,a)=>s+bal(a.id),0),h=new Date().getHours(),g=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam',best=[...S.habits].sort((a,b)=>streak(b)-streak(a))[0];
return `<div class="card hero row sp"><div><div class="mu" style="color:#ffffffcc">${g}, ${esc(S.prof.nick)} 👋</div><div class="big" style="font-size:19px">${esc(S.prof.name)}</div><div style="font-size:12px;opacity:.9">${esc(S.prof.job||'')}</div><div style="margin-top:6px;font-size:13px">Kebiasaan hari ini<br>${S.habits.filter(h=>isDone(h,today())).length} dari ${S.habits.length} selesai</div></div>${ring(pct())}</div>
${(!S.lastBk||Date.now()-S.lastBk>2592e6)?`<div class="card row sp"><span>💾 Sudah waktunya mencadangkan data Anda</span><button class="btn" onclick="openBk()">Cadangkan</button></div>`:''}<div class="grid"><div class="card"><div class="mu">Total Saldo</div><div class="big" style="font-size:17px">${fmt(tot)}</div></div><div class="card"><div class="mu">Tabungan</div><div class="big" style="font-size:17px">${fmt(sv)}</div></div>
<div class="card"><div class="mu">Pemasukan bulan ini</div><div class="in">${fmt(sum('in',mon()))}</div></div><div class="card"><div class="mu">Pengeluaran bulan ini</div><div class="out">${fmt(sum('out',mon()))}</div></div></div>
<div class="card"><h3>Kebiasaan hari ini <button class="btn s" onclick="go('habit')">Lihat</button></h3>${S.habits.slice(0,5).map(habitRow).join('')||'<p class="mu">Belum ada kebiasaan.</p>'}</div>
${best&&streak(best)?`<div class="card">🔥 Streak terbaik: <b>${best.icon} ${best.name}</b> — ${streak(best)} hari berturut-turut!</div>`:''}`},
habit(){const wk=S.habits.map(h=>{let n=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);if(isDone(h,ymd(d)))n++}return n}),tot=S.habits.length*7,pr=tot?Math.round(wk.reduce((a,b)=>a+b,0)/tot*100):0;
return `<div class="card hero row sp"><div><div class="big">${pct()}%</div><div>Selesai hari ini</div><div style="font-size:12px;margin-top:4px">Konsistensi 7 hari: ${pr}%</div></div>${ring(pr)}</div>
<button class="btn p" style="width:100%;margin-bottom:12px" onclick="rk('habit')">🖨 Rekap &amp; Cetak Bulanan</button><div class="card"><h3>Rutinitas Harian <span><button class="btn s" onclick="notif()">🔔</button> <button class="btn" onclick="addH()">+ Tambah</button></span></h3>${S.habits.map(h=>habitRow(h)).join('')||'<p class="mu">Tambahkan kebiasaan pertama Anda.</p>'}</div>
<div class="card"><h3>Kelola Kebiasaan <button class="btn s" onclick="clearHist()">Hapus riwayat</button></h3>${S.habits.map(h=>`<div class="item row sp"><span>${h.icon} ${h.name} <span class="mu">⏰ ${h.time}</span></span><span><button class="x" onclick="editH('${h.id}')">✏️</button><button class="x" onclick="delH('${h.id}')">🗑</button></span></div>`).join('')}</div>`},
fin(){const tx=S.tx.filter(t=>t.date.startsWith(mon())).sort((a,b)=>b.date.localeCompare(a.date)),am={};S.accounts.forEach(a=>am[a.id]=a.name);
const bd=Object.entries(S.budgets).map(([c,l])=>{const u=catData().find(x=>x[0]==c);const s=u?u[1]:0,p=Math.min(100,s/l*100);return `<div class="item"><div class="row sp"><b>${c}</b><span class="mu">${fmt(s)} / ${fmt(l)} <button class="x" onclick="delB('${c}')">×</button></span></div><div class="bar ${s>l?'o':''}"><i style="width:${p}%"></i></div></div>`}).join('')||'<p class="mu">Belum ada anggaran.</p>';

rekap(){const m=S.rm||mon(),ft=S.rt||'habit',[Y,M]=m.split('-').map(Number),nd=new Date(Y,M,0).getDate(),yr=S.rp=='y',bn=yr?'Tahun '+Y:BLN[M-1]+' '+Y;

tema(){const p=S.prof;return `<div class="card"><h3>👤 Profil <button class="btn s" onclick="showSetup(1)">Ubah</button></h3><div class="row"><div class="ico" style="font-weight:800;color:var(--a)">${esc(p.nick[0]||'?').toUpperCase()}</div><div><b>${esc(p.name)}</b><div class="mu">${esc(p.job||'-')}${p.dob?' · '+Math.floor((Date.now()-new Date(p.dob))/31557600000)+' th':''}</div><div class="mu">🎯 ${esc(p.goal||'-')}</div></div></div><button class="btn p" style="margin:10px 6px 0 0" onclick="openBk()">💾 Cadangkan data</button><button class="btn s" style="margin:10px 6px 0 0" onclick="chgPin()">🔑 PIN</button><button class="btn s" style="margin:10px 6px 0 0" onclick="mailCfg()">✉️ Layanan email</button><button class="btn s" style="margin-top:10px" onclick="logout()">🔒 Kunci / Keluar</button></div><div class="card"><h3>🎨 Pilih Tema</h3><div class="row" style="flex-wrap:wrap">${Object.entries(PRE).map(([n,c])=>`<div style="text-align:center"><div class="sw ${S.pre==n?'on':''}" style="background:linear-gradient(135deg,${c[0]} 50%,${c[1]} 50%)" onclick="setP('${n}')"></div><div class="mu">${n}</div></div>`).join('')}</div></div>

<div class="card mu"><b style="color:var(--tx)">HabitFinance v1.0</b><br>Data tersimpan di perangkat Anda dan tidak dikirim ke server mana pun. Satu-satunya pengecualian: email pemulihan PIN dan peringatan keamanan, jika layanan email diaktifkan.<br><button class="btn s" style="margin-top:8px" onclick="inst()">📲 Pasang aplikasi</button></div>`}};

/* rekap */
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function rk(t){S.rt=t;S.rm=mon();S.tab='rekap';save();render();scrollTo(0,0)}
function setRt(t){S.rt=t;render()}
function back(){go(S.rt=='fin'?'fin':'habit')}
function shM(n){const [Y,M]=(S.rm||mon()).split('-').map(Number),d=new Date(Y,M-1+(S.rp=='y'?n*12:n),1);S.rm=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}
function printR(){toast('Jika dialog cetak tidak muncul, buka versi aplikasi yang terpasang di HP/hosting');try{window.print()}catch(e){}}
function habRep(m,nd){const hs=S.habits;if(!hs.length)return '<p>Belum ada kebiasaan.</p>';const key=d=>m+'-'+pad(d),days=[...Array(nd).keys()].map(i=>i+1),dn=m==today().slice(0,7)?new Date().getDate():nd;
const rows=hs.map(h=>({h,c:days.filter(d=>h.done[key(d)]).length})),tot=rows.reduce((s,r)=>s+r.c,0),pc=Math.round(tot/(hs.length*dn)*100),best=[...rows].sort((a,b)=>b.c-a.c)[0];
return `<p><b>Konsistensi bulan ini: ${pc}%</b> (${tot} centang dari target ${hs.length*dn})${best.c?` · Terbaik: ${best.h.icon} ${esc(best.h.name)} (${best.c} hari)`:''}</p><table><tr><th>Kebiasaan</th>${days.map(d=>`<th class='c'>${d}</th>`).join('')}<th class='c'>Hari</th><th class='c'>%</th></tr>${rows.map(r=>`<tr><td>${r.h.icon} ${esc(r.h.name)}</td>${days.map(d=>`<td class='c'>${r.h.done[key(d)]?'✓':''}</td>`).join('')}<td class='c'><b>${r.c}</b></td><td class='c'>${Math.round(r.c/dn*100)}%</td></tr>`).join('')}</table><p style='color:#666'>✓ = kebiasaan dilakukan pada tanggal tersebut.</p>`}
function finRep(m){const T=S.tx.filter(t=>t.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date)),inc=sum('in',m),out=sum('out',m),cs={},am={};T.filter(t=>t.type=='out').forEach(t=>cs[t.cat]=(cs[t.cat]||0)+t.amt);S.accounts.forEach(a=>am[a.id]=a.name);
const cr=Object.entries(cs).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const b=S.budgets[c];return `<tr><td>${c}</td><td class='r'>${fmt(v)}</td><td class='c'>${Math.round(v/out*100)}%</td><td class='r'>${b?fmt(b):'-'}</td><td class='c'>${b?(v>b?'Melebihi':'Aman'):'-'}</td></tr>`}).join('')||`<tr><td colspan='5'>Tidak ada pengeluaran.</td></tr>`;
const ar=S.accounts.map(a=>`<tr><td>${esc(a.name)} (${a.type})</td><td class='r'>${fmt(S.tx.filter(t=>t.acc==a.id&&t.date.slice(0,7)<=m).reduce((s,t)=>s+(t.type=='in'?t.amt:-t.amt),0))}</td></tr>`).join('');
const tr=T.map(t=>`<tr><td class='c'>${t.date.slice(8)}</td><td>${t.cat}</td><td>${esc(t.note||'')}</td><td>${esc(am[t.acc]||'-')}</td><td class='r'>${t.type=='in'?fmt(t.amt):''}</td><td class='r'>${t.type=='out'?fmt(t.amt):''}</td></tr>`).join('')||`<tr><td colspan='6'>Tidak ada transaksi.</td></tr>`;
return `<table><tr><th>Ringkasan</th><th class='r'>Jumlah</th></tr><tr><td>Total pemasukan</td><td class='r'>${fmt(inc)}</td></tr><tr><td>Total pengeluaran</td><td class='r'>${fmt(out)}</td></tr><tr><td><b>Selisih (surplus/defisit)</b></td><td class='r'><b>${fmt(inc-out)}</b></td></tr></table><b>Pengeluaran per kategori</b><table><tr><th>Kategori</th><th class='r'>Jumlah</th><th>%</th><th class='r'>Anggaran</th><th>Status</th></tr>${cr}</table><b>Saldo akun akhir bulan</b><table>${ar}</table><b>Rincian transaksi</b><table><tr><th>Tgl</th><th>Kategori</th><th>Catatan</th><th>Akun</th><th class='r'>Masuk</th><th class='r'>Keluar</th></tr>${tr}<tr><th colspan='4'>Total</th><th class='r'>${fmt(inc)}</th><th class='r'>${fmt(out)}</th></tr></table>`}
function setRp(p){S.rp=p;render()}
function habYear(Y){const hs=S.habits;if(!hs.length)return '<p>Belum ada kebiasaan.</p>';const now=new Date(),dm=i=>(Y>now.getFullYear()||(Y==now.getFullYear()&&i>now.getMonth()))?0:(Y==now.getFullYear()&&i==now.getMonth())?now.getDate():new Date(Y,i+1,0).getDate();
const cnt=(h,i)=>Object.keys(h.done).filter(k=>k.startsWith(Y+'-'+pad(i+1))).length;let T=0,G=0;
const rows=hs.map(h=>{let t=0,g=0;const cells=BLN.map((_,i)=>{const c=cnt(h,i),d=dm(i);t+=c;g+=d;return `<td class='c'>${d?c+'/'+d:'-'}</td>`}).join('');T+=t;G+=g;return `<tr><td>${h.icon} ${esc(h.name)}</td>${cells}<td class='c'><b>${t}</b></td><td class='c'>${g?Math.round(t/g*100):0}%</td></tr>`}).join('');
return `<p><b>Konsistensi tahun ${Y}: ${G?Math.round(T/G*100):0}%</b> (${T} centang dari target ${G})</p><table><tr><th>Kebiasaan</th>${BLN.map(b=>`<th class='c'>${b.slice(0,3)}</th>`).join('')}<th class='c'>Total</th><th class='c'>%</th></tr>${rows}</table><p style='color:#666'>Angka = hari dilakukan / hari berjalan pada bulan tersebut.</p>`}
function finYear(Y){const y=String(Y);let ti=0,to=0;const rows=BLN.map((b,i)=>{const m=y+'-'+pad(i+1),a=sum('in',m),o=sum('out',m);ti+=a;to+=o;return `<tr><td>${b}</td><td class='r'>${fmt(a)}</td><td class='r'>${fmt(o)}</td><td class='r'>${fmt(a-o)}</td></tr>`}).join('');
const cs={};S.tx.filter(t=>t.type=='out'&&t.date.startsWith(y)).forEach(t=>cs[t.cat]=(cs[t.cat]||0)+t.amt);
const cr=Object.entries(cs).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td>${c}</td><td class='r'>${fmt(v)}</td><td class='c'>${Math.round(v/to*100)}%</td><td class='r'>${fmt(v/12)}</td></tr>`).join('')||`<tr><td colspan='4'>Tidak ada pengeluaran.</td></tr>`;
const ar=S.accounts.map(a=>`<tr><td>${esc(a.name)} (${a.type})</td><td class='r'>${fmt(S.tx.filter(t=>t.acc==a.id&&t.date.slice(0,4)<=y).reduce((s,t)=>s+(t.type=='in'?t.amt:-t.amt),0))}</td></tr>`).join('');
return `<table><tr><th>Bulan</th><th class='r'>Pemasukan</th><th class='r'>Pengeluaran</th><th class='r'>Selisih</th></tr>${rows}<tr><th>Total ${Y}</th><th class='r'>${fmt(ti)}</th><th class='r'>${fmt(to)}</th><th class='r'>${fmt(ti-to)}</th></tr></table><b>Pengeluaran per kategori setahun</b><table><tr><th>Kategori</th><th class='r'>Jumlah</th><th>%</th><th class='r'>Rata-rata/bulan</th></tr>${cr}</table><b>Saldo akun akhir tahun</b><table>${ar}</table>`}

let bad=0,lockUntil=0,rc=null,hid=0,dip=null;
const mailOK=()=>S.mail&&S.mail.svc&&S.mail.tpl&&S.mail.key;
async function sendMail(p){const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:S.mail.svc,template_id:S.mail.tpl,user_id:S.mail.key,template_params:Object.assign({to_email:S.prof.email,to_name:S.prof.nick,app_name:'HabitFinance'},p)})});if(!r.ok)throw new Error('mail')}
function mailCfg(){const m=S.mail||{};form('Layanan Email (EmailJS)',[{k:'svc',l:'Service ID',v:m.svc||''},{k:'tpl',l:'Template ID',v:m.tpl||''},{k:'key',l:'Public Key',v:m.key||''}],v=>{S.mail={svc:v.svc.trim(),tpl:v.tpl.trim(),key:v.key.trim()};save();if(!mailOK())return toast('Pengaturan tersimpan (belum lengkap)');if(!S.prof.email)return toast('Isi email pribadi lewat tombol Ubah profil');toast('Mengirim email uji...');sendMail({subject:'Uji HabitFinance',message:'Email uji berhasil. Pemulihan PIN lewat email sudah aktif.'}).then(()=>toast('Email uji terkirim ke '+S.prof.email)).catch(()=>toast('Gagal mengirim. Periksa pengaturan EmailJS & koneksi internet'))})}
function chgPin(){const has=!!S.prof.pin;form(has?'Ubah PIN':'Buat PIN',[...(has?[{k:'o',l:'PIN lama',t:'password'}]:[]),{k:'n',l:'PIN baru 4 angka (kosongkan untuk menghapus PIN)',t:'password'}],v=>{if(has&&btoa('hf'+v.o)!=S.prof.pin)return toast('PIN lama salah');if(v.n&&!/^\d{4}$/.test(v.n))return toast('PIN harus 4 angka');S.prof.pin=v.n?btoa('hf'+v.n):'';save();render();toast(v.n?'PIN diperbarui':'PIN dihapus');if(mailOK()&&S.prof.email)sendMail({subject:'PIN HabitFinance diubah',message:'PIN Anda diubah pada '+new Date().toLocaleString('id-ID')+'.'}).catch(()=>{})})}

form('Lupa PIN',[{k:'e',l:'Email terdaftar',t:'email'}],async v=>{if(v.e.trim().toLowerCase()!=S.prof.email.toLowerCase())return toast('Email tidak sesuai dengan yang terdaftar');const c=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);rc={h:btoa('rc'+c),exp:Date.now()+6e5,n:0};toast('Mengirim kode ke email...');
try{await sendMail({subject:'Kode reset PIN HabitFinance',message:'Kode verifikasi Anda: '+c+' (berlaku 10 menit). Abaikan email ini jika Anda tidak memintanya.'})}catch(e){rc=null;return toast('Gagal mengirim email. Periksa koneksi & pengaturan layanan email')}vf()})}
function vf(){form('Masukkan Kode dari Email',[{k:'c',l:'Kode 6 angka'},{k:'n',l:'PIN baru (4 angka)',t:'password'}],v=>{if(!rc||Date.now()>rc.exp||rc.n>=5){rc=null;return toast('Kode kedaluwarsa, ulangi Lupa PIN')}if(!/^\d{4}$/.test(v.n)){toast('PIN harus 4 angka');return vf()}if(btoa('rc'+v.c.trim())!=rc.h){rc.n++;toast('Kode salah');return vf()}rc=null;S.prof.pin=btoa('hf'+v.n);unlocked=true;save();render();toast('PIN berhasil diperbarui ✅');sendMail({subject:'PIN HabitFinance diperbarui',message:'PIN Anda diperbarui lewat fitur Lupa PIN pada '+new Date().toLocaleString('id-ID')+'.'}).catch(()=>{})})}
function fm(n){const [Y,M]=mon().split('-').map(Number),d=new Date(Y,M-1+n,1);S.fv=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}
function editT(id){const t=S.tx.find(x=>x.id==id);form('Ubah Transaksi',[{k:'amt',l:'Jumlah (Rp)',t:'number',v:t.amt},{k:'cat',l:'Kategori',t:'select',o:t.type=='in'?INC:OUT,v:t.cat},{k:'acc',l:'Akun',t:'select',o:S.accounts.map(a=>[a.id,a.name]),v:t.acc},{k:'note',l:'Catatan',v:t.note||''},{k:'date',l:'Tanggal',t:'date',v:t.date}],v=>{if(+v.amt>0){Object.assign(t,{amt:+v.amt,cat:v.cat,acc:v.acc,note:v.note,date:v.date||t.date});save();render()}else toast('Jumlah harus lebih dari 0')})}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let unlocked=false;
function gate(){const n=$('#nav');if(!S.prof){n.style.display='none';showSetup();return true}if(S.prof.pin&&!unlocked){n.style.display='none';showLock();return true}n.style.display='';return false}
function showSetup(edit){const p=S.prof||{},f=(k,l,x='')=>`<label>${l}<input name="${k}" value="${esc(p[k]||'')}" ${x}></label>`;
$('#main').innerHTML=`<div class="card"><h3>${edit?'Ubah Profil':'👋 Selamat datang! Isi identitas Anda'}</h3><form id="sf" style="display:grid;gap:10px">${f('name','Nama lengkap (beserta gelar)','required')}${f('nick','Nama panggilan','required')}${f('job','Pekerjaan / profesi')}${f('email','Email pribadi (untuk cadangan data)','type=email')}<label>Tanggal lahir<input name="dob" type="date" value="${p.dob||''}"></label>${f('goal','Tujuan utama menggunakan aplikasi')}<label>${edit?'PIN baru (kosongkan = tidak diubah)':'PIN 4 angka (opsional, untuk mengunci aplikasi)'}<input name="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}"></label><div class="row">${edit?'<button type="button" class="btn s grow" onclick="render()">Batal</button>':''}<button class="btn grow">${edit?'Simpan':'Masuk'}</button></div></form></div>`;
$('#sf').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));S.prof={name:v.name.trim(),nick:v.nick.trim(),job:v.job,dob:v.dob,goal:v.goal,email:v.email||'',pin:v.pin?btoa('hf'+v.pin):(p.pin||'')};unlocked=true;save();render()}}
function showLock(){$('#main').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:42px">🔐</div><h3 style="justify-content:center">Halo, ${esc(S.prof.nick)}!</h3><p class="mu">Masukkan PIN untuk masuk</p><input id="pn" type="password" inputmode="numeric" maxlength="4" onkeydown="if(event.key=='Enter')chk()" style="text-align:center;font-size:24px;letter-spacing:8px;margin:12px 0"><button class="btn" onclick="chk()">Masuk</button><p class="mu" style="margin-top:14px"><a href="#" style="color:var(--a)" onclick="forgot();return false">Lupa PIN?</a></p></div>`}
function chk(){if(Date.now()<lockUntil)return toast('Terkunci sementara, coba lagi sebentar');if(btoa('hf'+$('#pn').value)==S.prof.pin){bad=0;unlocked=true;render()}else{bad++;toast('PIN salah ('+bad+'/3)');$('#pn').value='';if(bad>=3){bad=0;lockUntil=Date.now()+3e4;toast('3 kali salah. Terkunci 30 detik.');if(mailOK()&&S.prof.email)sendMail({subject:'Peringatan keamanan HabitFinance',message:'Ada 3 kali percobaan PIN yang salah pada '+new Date().toLocaleString('id-ID')+'. Jika bukan Anda, segera ganti PIN.'}).catch(()=>{})}}}
function logout(){if(S.prof.pin){unlocked=false;render()}else toast('Atur PIN lewat tombol Ubah agar aplikasi bisa dikunci')}
function resetAll(){try{localStorage.removeItem('hf')}catch(e){}location.reload()}
function ask(m,cb){const d=$('#md');d.innerHTML=`<div class="box"><b>${esc(m)}</b><div class="row"><button class="btn s grow" onclick="closeM()">Batal</button><button class="btn grow" style="background:var(--rd)" id="ok">Ya, lanjutkan</button></div></div>`;d.classList.add('show');$('#ok').onclick=()=>{closeM();cb()}}
/* modal */
function form(t,f,cb){const m=$('#md');m.innerHTML=`<form><b>${t}</b>${f.map(x=>`<label>${x.l}${x.t=='select'?`<select name="${x.k}">${x.o.map(o=>Array.isArray(o)?`<option value="${o[0]}" ${o[0]==x.v?'selected':''}>${o[1]}</option>`:`<option ${o==x.v?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${x.k}" type="${x.t||'text'}" value="${esc(x.v??'')}" ${x.t=='number'?'inputmode="numeric"':''}>`}</label>`).join('')}<div class="row"><button type="button" class="btn s grow" onclick="closeM()">Batal</button><button class="btn grow">Simpan</button></div></form>`;m.classList.add('show');
m.querySelector('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));closeM();cb(v)}}
function closeM(){$('#md').classList.remove('show')}
/* reminders */
function notif(){if(!('Notification' in window))return toast('Browser tidak mendukung notifikasi');Notification.requestPermission().then(p=>toast(p=='granted'?'Pengingat notifikasi aktif ✅':'Izin notifikasi ditolak'))}
const fired={};
setInterval(()=>{const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes());S.habits.forEach(h=>{const k=h.id+today()+hm;if(h.time==hm&&!isDone(h,today())&&!fired[k]){fired[k]=1;toast(`⏰ Waktunya: ${h.icon} ${h.name}`);try{if(Notification.permission=='granted')new Notification('HabitFinance',{body:'Waktunya '+h.name})}catch(e){}}})},20000);
function render(){theme();if(gate())return;$('#main').innerHTML=V[S.tab]();$('#nav').innerHTML=[['home','🏠','Beranda'],['habit','✅','Kebiasaan'],['fin','💰','Keuangan'],['tema','👤','Profil']].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
